name: Update AIS Track

on:
  schedule:
    # Run every 60 minutes
    - cron: '0 * * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.PERSONAL_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'


      - name: Install dependencies
        run: npm install ws

      - name: Update track data
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          AIS_MMSI: ${{ vars.AIS_MMSI }}
          MARINESIA_API_KEY: ${{ vars.MARINESIA_API_KEY }}
          MARINESIA_USE_DUMMY: "false"
        run: |
          node server/update-track-geojson.js

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/track.geojson data/aton.geojson
          if git diff --cached --quiet; then
            echo "No changes to track.geojson or aton.geojson"
          else
            git commit -m "Update track data from AISStream [skip ci]"
            git push
          fi
