<script>
//content-section loading

const sectionLoads = [
  loadHTML('landing', 'components/landing/landing_page.html'),
  loadHTML('menu-bar', 'components/header/menu_bar.html'),
  loadHTML('ueber-uns', 'components/about/ueber_uns.html'),
  loadHTML('blog', 'pages/blog/blog.html'),
  loadHTML('map', 'components/map/map.html'),
  loadHTML('footer', 'components/footer/Footer.html'),
  loadHTML('kontakt-modal', 'components/footer/kontakt.html'),
  loadHTML('impressum-modal', 'components/footer/impressum.html'),
  loadHTML('datenschutz-modal', 'components/footer/datenschutz.html'),
];

// After all sections are injected, scroll to hash if present
Promise.all(sectionLoads).then(() => {
  setTimeout(() => {
    const hash = window.location.hash;
    if (hash) {
      const targetId = hash.slice(1);
      const target = document.getElementById(targetId);
      if (target) {
        const menuBarHeight = document.getElementById('menu-bar')?.offsetHeight || 0;
        window.scrollTo({ top: target.offsetTop - menuBarHeight, behavior: 'smooth' });
      }
    }
  }, 0);
  
  document.body.classList.add('is-ready');
});

</script>
