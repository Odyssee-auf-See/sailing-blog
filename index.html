<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odyssee auf See</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,800&display=swap" rel="stylesheet">

  <style>
    /* Reset margin and padding */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Make the page take full height */
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Source Code Pro', monospace;
    }

    /* Main background container */
    .background {
      position: relative;
      width: 100%;
      height: 100%;
      background-image: url('images/background1.jpg');
      background-size: cover;
      background-position: center;
      z-index: 2;
    }

    /* Optional background layer for additional effects */
    .background::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background-image: url('images/background1.jpg');
      background-size: cover;
      background-position: center;
      z-index: -1;
    }

    /* Title styling */
    .title {
      position: absolute;
      top: 20%;
      width: 100%; /* Full width of screen */
      font-size: 5.5vw;
      font-weight: 800;
      text-align: center;
      letter-spacing: 2.6vw;
      background: url('images/titlecolorimg.jpg') center/cover;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
      opacity: 0;
      animation: fadeIn 1s ease-out forwards;
      animation-delay: 0.5s;
      z-index: 3;
      padding: 0 1vw;
    }

    /* Fade-in animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="background">
    <div class="title">ODYSSEE AUF SEE</div>
  </div>

</body>
</html>
