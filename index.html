<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Odyssee auf See</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .background {
      background-image: url('images/background.jpg'); /* Replace with your background image */
      background-size: cover;
      background-position: center;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .image-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      gap: 2vw;
    }

    .portrait-img {
      width: auto;
      height: 80vh; /* Maintains 9:16 ratio */
      aspect-ratio: 9 / 16;
      background-color: rgba(255, 255, 255, 0.2); /* Placeholder background */
      border: 2px solid #fff;
      border-radius: 12px;
      object-fit: cover;
    }

    @media (max-width: 768px) {
      .image-container {
        flex-direction: column;
        gap: 3vh;
      }
      .portrait-img {
        height: 40vh;
      }
    }
  </style>
</head>
<body>

  <div class="background">
    <div class="image-container">
      <img src="images/img1.jpg" alt="Placeholder 1" class="portrait-img" />
      <img src="images/img2.jpg" alt="Placeholder 2" class="portrait-img" />
      <img src="images/img3.jpg" alt="Placeholder 3" class="portrait-img" />
    </div>
  </div>

</body>
</html>
