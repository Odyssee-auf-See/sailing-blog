<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fascinate&family=Nova+Mono&display=swap" rel="stylesheet">
  <title>Odyssee auf See</title>
  <style>
    /* Reset default spacing and use border-box for easier sizing */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Full height layout */
    body, html {
      height: 100%;
    }

    /* Fullscreen background image */
    .background {
      background-image: url('images/background.jpg');
      background-size: cover;
      background-position: center;
      width: 100%;
      height: 100%;
    }

    /* Wrapper that holds all 3 images and the title */
    .img-wrapper {
      position: relative;               /* Needed to absolutely position title inside */
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100%;
      gap: 2vw;
    }

    /* Images appear tall and narrow (9:16) */
    .portrait-img {
      height: 80vh;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      display: block;
      opacity: 0;
      animation: fade-in 1.2s ease-out forwards;
    }

    /* Fade-in delays per image */
    .portrait-img:nth-child(1) {
      animation-delay: 0s;
    }
    .portrait-img:nth-child(2) {
      animation-delay: 0.3s;
    }
    .portrait-img:nth-child(3) {
      animation-delay: 0.6s;
    }

    /* Title overlay */
    .title {
      position: absolute;
      bottom: 25%;                       /* Position near bottom */
      transform: translateX(-50%);
      font-size: 7.5rem;
      font-weight: bold;
      color: #dfd7cd;
      text-shadow: 0 0 10px rgba(0,0,0,0.6);
      opacity: 0;
      animation: fade-in-title 1.2s ease-out forwards;
      animation-delay: 1.2s;            /* After last image fades in */
      z-index: 2;
      text-align: center;
      font-family: 'Nova mono', monospace;
    }

    /* Fade-in animation for images */
    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Fade-in animation for title */
    @keyframes fade-in-title {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive layout */
    @media (max-width: 768px) {
      .img-wrapper {
        flex-direction: column;
        align-items: center;
        gap: 2vh;
      }

      .portrait-img {
        width: 60vw;
        height: auto;
        aspect-ratio: unset;
      }

      .title {
        font-size: 2rem;
        bottom: 2vh;
      }
    }
  </style>
</head>
<body>

  <div class="background">
    <div class="img-wrapper">
      <img src="images/img1.jpg" alt="Image 1" class="portrait-img" />
      <img src="images/img2.jpg" alt="Image 2" class="portrait-img" />
      <img src="images/img3.jpg" alt="Image 3" class="portrait-img" />
      <div class="title">Odyssee auf See</div>
    </div>
  </div>

</body>
</html>
