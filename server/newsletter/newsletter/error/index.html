<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fehler bei der Newsletter-Bestätigung - Odyssee auf See</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
  <style>

    .newsletter-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Roboto', sans-serif;
      background: #fff8f3;
    }
    .newsletter-card {
      max-width: 760px;
      width: 100%;
      background: #ffffff;
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .newsletter-kicker {
      display: inline-block;
      margin-bottom: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #c33a2c;
    }
    .newsletter-title {
      margin: 0 0 16px;
      font-size: clamp(2rem, 3vw, 2.6rem);
      line-height: 1.1;
      color: #8b2e22;
    }
    .newsletter-text {
      margin: 0 auto;
      max-width: 60ch;
      font-size: 1.05rem;
      line-height: 1.8;
      color: #4b3d35;
    }
    .newsletter-actions {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .newsletter-btn {
      display: inline-block;
      text-decoration: none;
      border-radius: 999px;
      padding: 14px 26px;
      font-weight: 700;
      border: 2px solid #c33a2c;
      color: #c33a2c;
      transition: all 0.2s ease;
    }
    .newsletter-btn:hover {
      background: #c33a2c;
      color: #fff;
    }
  </style>
</head>
<body class="is-ready">
  <main class="newsletter-page-wrap">
    <section class="newsletter-card" aria-live="polite">
      <span class="newsletter-kicker">Newsletter Bestätigung</span>
      <h1 class="newsletter-title">Etwas ist schiefgelaufen.</h1>
      <p class="newsletter-text">
        Der Bestätigungslink konnte nicht erfolgreich verarbeitet werden. Bitte versuche es erneut oder kontaktiere uns,
        wenn du den Newsletter weiterhin nicht aktivieren kannst.
      </p>
      <div class="newsletter-actions">
        <a class="newsletter-btn" href="/index.html">Zur Startseite</a>
        <a class="newsletter-btn" href="/#blog">Zum Blog</a>
      </div>
    </section>
  </main>
</body>
</html>
