<main class="blog-container">
  <h1 class="blog-header">Logbuch</h1>

  <div class="filter-box" role="group" aria-label="Filter posts by category">
    <button class="filter-btn active" onclick="filterBlog('Alle')" aria-label="Show all blog posts">Alle</button>
    <button class="filter-btn" onclick="filterBlog('Reisen')" aria-label="Filter posts by Reisen category">Reisen</button>
    <button class="filter-btn" onclick="filterBlog('Boot')" aria-label="Filter posts by Boot category">Boot</button>
    <button class="filter-btn" onclick="filterBlog('Nachhaltigkeit')" aria-label="Filter posts by Nachhaltigkeit category">Nachhaltigkeit</button>
    <button class="filter-btn" onclick="filterBlog('Gedankenchaos')" aria-label="Filter posts by Gedankenchaos category">Gedankenchaos</button>
  </div>

<div class="blog-layout-wrapper">
    <div id="featured-section"></div>
    
    <div id="masonry-section" class="masonry-columns-container">
        <div class="masonry-col" id="col-1"></div>
        <div class="masonry-col" id="col-2"></div>
        <div class="masonry-col" id="col-3"></div>
    </div>
</div>
  <div class="load-more-container">
    <button id="loadMoreBtn" class="load-more-btn" onclick="showAllPosts()">Ältere Beiträge laden</button>
  </div>
</main>
