<div class="map-section">
  <h2 class="map-title">Our Current Position</h2>
  
  <div class="map-info-grid">
    <div class="map-info-box">
      <div class="map-info-symbol">📍</div>
      <div class="map-info-label">Coordinates</div>
      <div class="map-info-value" id="ais-latitude">--°--'</div>
      <div class="map-info-value" id="ais-longitude">--°--'</div>
    </div>
    
    <div class="map-info-box">
      <div class="map-info-symbol">💨</div>
      <div class="map-info-label">Wind Strength</div>
      <div class="map-info-value" id="ais-wind">-- kt</div>
    </div>
    
    <div class="map-info-box">
      <div class="map-info-symbol">🌊</div>
      <div class="map-info-label">Distance Sailed</div>
      <div class="map-info-value" id="ais-distance">-- nm</div>
    </div>
    
    <div class="map-info-box">
      <div class="map-info-symbol">⏰</div>
      <div class="map-info-label">Local Time</div>
      <div class="map-info-value" id="ais-localtime">--:--:--</div>
    </div>
  </div>

  <div class="map-container" id="map"></div>
</div>
