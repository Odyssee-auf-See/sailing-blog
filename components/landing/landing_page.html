<div class="landing-hero">
  <div class="landing-hero__image">
    <img src="assets/images/backgrounds/background.jpg" alt="Landing Page Image">
  </div>

  <div class="landing-hero__right-panel">
    <div class="landing-hero__logo-wrap">
      <span class="landing-hero__logo-icon"></span>

      <svg class="landing-hero__curved-text" viewBox="0 0 100 100">
        <path id="landing-hero-curve" d="M 7,70 A 49,49 0 0,0 93,70" fill="transparent" />

        <text>
          <textPath class="landing-hero__text-path" xlink:href="#landing-hero-curve" startOffset="50%" text-anchor="middle">
            Sailing Adventure
          </textPath>
        </text>
      </svg>
    </div>
  </div>

  <img class="landing-hero__seam-wave" src="assets/svgs/decorations/welle_title.svg" alt="">

  <div class="landing-hero__quote">
    Das Meer ist unser Lehrer, der Wind unser Begleiter, die Sonne unsere Energie, die Tiere unsere Freunde und der Horizont unser Ziel.
  </div>
</div>
